<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ganaderos Campo</title>
  <base href="./">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
  <meta name="theme-color" content="#1e3a2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Campo">
  <meta name="application-name" content="Ganaderos Campo">

  <link rel="stylesheet" href="./css/app.css?v=m3">
</head>
<body>
  <!-- Encabezado Superior -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <img src="./icon-192.png" alt="Ganaderos Campo" class="brand-logo-img">
        <div class="brand-text">
          <h1>Ganaderos Campo</h1>
          <span class="brand-sub" id="meta-fecha">Censo: Cargando...</span>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-install-pwa" class="header-install-btn" style="display: none;" title="Instalar aplicación en tu dispositivo">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Instalar</span>
        </button>

        <a href="/meteo/" class="header-meteo-btn" title="Ir a Estación Meteorológica">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
          </svg>
          <span>Meteo</span>
        </a>

        <button id="btn-sync-badge" class="header-sync-btn synced" style="display: none;" title="Estado de sincronización de campo">
          <span class="sync-dot"></span>
          <span id="sync-badge-text">Al día</span>
        </button>

        <button id="btn-header-user" class="header-user-btn" style="display: none;" title="Cambiar operador o cerrar sesión">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="header-user-name">Operador</span>
        </button>

        <!-- Navegación para PC / Pantallas medianas y grandes -->
        <nav class="desktop-nav">
        <button class="nav-link active" data-tab="animales">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="5"></circle>
            <path d="M3 21v-2a7 7 0 0 1 14 0v2"></path>
            <path d="M19 11l3 3-3 3"></path>
          </svg>
          <span>Animales</span>
        </button>
        <button class="nav-link" data-tab="recetas">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Recetas</span>
        </button>
        <button class="nav-link" data-tab="alimentos">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Alimentos</span>
        </button>
        <button class="nav-link" data-tab="movimientos">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span>Movimientos</span>
        </button>
        <button class="nav-link" data-tab="ventas">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <span>Ventas</span>
        </button>
      </nav>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal Adaptativo -->
  <main class="main-container" id="app-container">
    <div class="loading-state">
      <img src="./icon-192.png" alt="Ganaderos" class="loading-logo">
      <div class="spinner"></div>
      <h2>Abriendo base de datos local...</h2>
      <p id="loading-msg">Preparando censo offline</p>
    </div>
  </main>

  <!-- Barra Inferior Fija para Móvil (< 768px) -->
  <nav class="mobile-tab-bar">
    <button class="mobile-tab-btn active" data-tab="animales">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="5"></circle>
        <path d="M3 21v-2a7 7 0 0 1 14 0v2"></path>
      </svg>
      <span>Animales</span>
    </button>
    <button class="mobile-tab-btn" data-tab="recetas">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
      </svg>
      <span>Recetas</span>
    </button>
    <button class="mobile-tab-btn" data-tab="alimentos">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span>Alimentos</span>
    </button>
    <button class="mobile-tab-btn" data-tab="movimientos">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
      <span>Movimientos</span>
    </button>
    <button class="mobile-tab-btn" data-tab="ventas">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span>Ventas</span>
    </button>
  </nav>

  <!-- Botón Flotante para Asistente de IA por Voz -->
  <button class="btn-floating-ai" id="btn-open-ai" title="Consultar por voz o IA">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
    <span>Asistente</span>
  </button>

  <!-- Modal del Asistente de IA (Voz y Consultas Complejas) -->
  <div class="ai-modal-backdrop" id="ai-modal-backdrop" style="display: none;">
    <div class="ai-modal-card">
      <div class="ai-modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="ai-icon-badge">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            </svg>
          </div>
          <div>
            <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-main);">Asistente Ganadero</h3>
            <span style="font-size: 0.78rem; color: var(--text-muted);">Consultas por voz y lenguaje natural con IA</span>
          </div>
        </div>
        <button class="btn-close-modal" id="btn-close-ai">✕</button>
      </div>

      <!-- Selector de Modelo y Proveedor -->
      <div class="ai-model-selector-bar">
        <div class="ai-model-select-wrapper">
          <label for="select-ai-model">IA:</label>
          <select id="select-ai-model" class="ai-model-select">
            <option value="auto">⚡ Automático (Mayor Inteligencia)</option>
          </select>
        </div>
        <button class="btn-clear-ai-history" id="btn-clear-ai-history" title="Nueva conversación (limpiar contexto previo)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
          <span class="btn-clear-text">Nueva consulta</span>
        </button>
      </div>

      <div class="ai-modal-body">
        <!-- Entrada de Voz Principal -->
        <div class="voice-hero-box">
          <button class="btn-record-voice" id="btn-record-voice">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <div class="voice-status-text" id="voice-status-text">Toca el micrófono para hablar</div>
          <div class="voice-waveform" id="voice-waveform" style="display: none;">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- Entrada de Texto / Escribir pregunta -->
        <div class="ai-input-row">
          <input 
            type="text" 
            id="txt-ai-prompt" 
            class="ai-input" 
            placeholder="O escribe aquí tu consulta..." 
            autocomplete="off" 
          />
          <button class="btn-send-ai" id="btn-send-ai">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <!-- Preguntas Rápidas / Sugerencias -->
        <div class="ai-suggestions-title">Preguntas rápidas de ejemplo:</div>
        <div class="ai-chips-scroll">
          <button class="ai-chip-suggestion" data-prompt="¿Cuántas vacas activas hay en el corral Dueña?">
            Vacas activas en Dueña
          </button>
          <button class="ai-chip-suggestion" data-prompt="¿Qué vacas hay en Dueña que no hayan parido nunca o lleven más de 2 años sin parir?">
            Sin parir en Dueña
          </button>
          <button class="ai-chip-suggestion" data-prompt="¿Cuál es el medicamento que más veces se ha recetado en la explotación 121?">
            Medicamento más usado
          </button>
          <button class="ai-chip-suggestion" data-prompt="¿Qué animales se han traspasado de la explotación 121 a la 122 en los últimos traspasos?">
            Últimos traspasos al cebadero
          </button>
          <button class="ai-chip-suggestion" data-prompt="Dame la ficha completa de la vaca 0391: corral, raza, fecha de nacimiento, total de partos y fecha del último parto.">
            Ficha de la vaca 0391
          </button>
        </div>

        <!-- Contenedor de Respuestas del Asistente -->
        <div class="ai-results-wrapper" id="ai-results-wrapper" style="display: none;">
          <div class="ai-bubble-response" id="ai-bubble-response"></div>
          <div class="ai-cards-container" id="ai-cards-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/sql-wasm.js"></script>
  <script src="./js/db_client.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
