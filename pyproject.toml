[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ganaderos"
version = "1.0.0"
description = "PWA offline-first para gestión y censo de vacuno en campo con SQLite WebAssembly y asistente de voz híbrido"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alvaro", email = "alvarogil137@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Agricultural Information",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
exporter = [
    "pyodbc>=5.0.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.bandit]
skips = ["B104", "B310"]
exclude_dirs = ["tests", "venv", ".venv", "scratch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
